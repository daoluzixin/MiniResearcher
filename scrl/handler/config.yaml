# Web Search Agent
search_engine: "searxng" # "google", "bing", "duckduckgo", "baidu", "proxy", "searxng"
search_top_k: 10
search_region: "us"
search_lang: "en"
page_view_port_size: 1024*40
serper_api_key: "key here if you use serper"

reading_agent_model: "qwen-plus"

azure_bing_search_subscription_key: "key here if you use azure bing"
azure_bing_search_mkt: "zh-CN" # "en-US"

baidu_qianfan_api_key: "key here if you use baidu qianfan"

# Proxy search settings (for GPU servers without internet access)
# Run scripts/search_proxy.py on a machine with internet, then SSH reverse tunnel:
#   ssh -R 8080:localhost:8080 root@gpu-server
search_proxy_url: "http://localhost:8080"
search_proxy_max_retries: 3

# SearXNG settings (local meta-search engine, no API key needed)
# Runs on the GPU server itself, no SSH tunnel required
searxng_url: "http://localhost:8890"
searxng_max_retries: 3

# DuckDuckGo settings (free search engine, rate-limited)
duckduckgo_max_concurrent: 5   # max concurrent requests to DuckDuckGo
duckduckgo_min_interval: 1.0   # min seconds between requests (per slot)
duckduckgo_max_retries: 5      # max retries on rate limit errors

query_save_path: "./scrl/handler/cache/search_result.json"

server_url_list:
  - "http://localhost:5000"
  - "http://xxx:5000"
